# docker-compose.yml — one service per agent + coordinator
# TODO: Replace placeholder agent names with your actual agent names

services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    ports:
      - "${COORDINATOR_PORT:-8000}:8000"
    volumes:
      - shared_data:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: reach Ollama on the host
    environment:
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - MODEL_NAME=${MODEL_NAME:-qwen2.5-coder:7b}
      - SHARED_VOLUME=/work/shared

  # TODO: Add one block per agent. Copy this block and rename 'agent_alpha'.
  agent_alpha:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_MODULE: agent_alpha   # TODO: Python module name (under src/)
    ports:
      - "9000:8080"
    volumes:
      - shared_data:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - MODEL_NAME=${MODEL_NAME:-qwen2.5-coder:7b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}

volumes:
  shared_data:
