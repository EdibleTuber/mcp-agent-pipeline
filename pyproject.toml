[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-agent-pipeline"
version = "0.1.0"
description = "Reusable multi-agent MCP pipeline framework"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "pydantic>=2.0",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "anyio",
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/framework"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
